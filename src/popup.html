<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Focus Blocker</h1>

  <ul class="sites">
    <li>
      <label for="youtube">
        <span class="name">YouTube</span>
        <span class="detail">Home feed, comments, recommendations</span>
      </label>
      <input type="checkbox" id="youtube" class="switch">
    </li>
    <li>
      <label for="amazon">
        <span class="name">Amazon</span>
        <span class="detail">Home page below the top menus</span>
      </label>
      <input type="checkbox" id="amazon" class="switch">
    </li>
    <li>
      <label for="linkedin">
        <span class="name">LinkedIn</span>
        <span class="detail">Feed, post box, news, puzzles</span>
      </label>
      <input type="checkbox" id="linkedin" class="switch">
    </li>
    <li>
      <label for="instagram">
        <span class="name">Instagram</span>
        <span class="detail">Feed after 10 posts or "all caught up"</span>
      </label>
      <input type="checkbox" id="instagram" class="switch">
    </li>
    <li>
      <label for="facebook">
        <span class="name">Facebook</span>
        <span class="detail">Feed after 10 posts</span>
      </label>
      <input type="checkbox" id="facebook" class="switch">
    </li>
  </ul>

  <p class="hint">Changes apply immediately to open tabs.</p>

  <script src="popup.js"></script>
</body>
</html>
